<div class="auth-container">
  <div class="auth-card">

    <div style="display: flex; justify-content: flex-end; margin-bottom: 0.5rem;">
      <app-language-selector></app-language-selector>
    </div>

    <div class="auth-logo">
      <svg class="auth-logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="mobde3LogoGradLogin" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5"/>
            <stop offset="50%" stop-color="#7c3aed"/>
            <stop offset="100%" stop-color="#0284c7"/>
          </linearGradient>
        </defs>
        <path d="M20 2L35 10.5V29.5L20 38L5 29.5V10.5L20 2Z" fill="url(#mobde3LogoGradLogin)"/>
        <path d="M20 5.5L32 12V28L20 34.5L8 28V12L20 5.5Z" fill="#ffffff" opacity="0.2"/>
        <path d="M11 27V13L20 21L29 13V27" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="21" r="1.8" fill="#38bdf8"/>
      </svg>
      <p class="auth-brand-name">Mobde3</p>
    </div>

    <h2>{{ 'auth_login_welcome' | translate }}</h2>
    <p class="auth-subtitle">{{ 'auth_login_sub' | translate }}</p>

    <!-- ── Bouton Google ── -->
    <button class="btn-google" (click)="onGoogleLogin()" [disabled]="googleLoading">
      <span class="btn-google__inner" *ngIf="!googleLoading">
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        {{ 'auth_google_btn' | translate }}
      </span>
      <span class="btn-google__inner" *ngIf="googleLoading">
        <span class="spinner spinner--dark"></span>
        {{ 'auth_login_submitting' | translate }}
      </span>
    </button>

    <!-- ── Séparateur ── -->
    <div class="auth-divider">
      <span>{{ 'auth_or' | translate }}</span>
    </div>

    <!-- ── Formulaire classique ── -->
    <input type="email" [(ngModel)]="email" [placeholder]="'auth_email_placeholder' | translate" autocomplete="email" />
    <input type="password" [(ngModel)]="password" [placeholder]="'auth_password_placeholder' | translate" autocomplete="current-password" />

    <p class="error" *ngIf="error">{{ error }}</p>

    <button (click)="onLogin()" [disabled]="loading">
      {{ loading ? ('auth_login_submitting' | translate) : ('auth_login_submit' | translate) }}
    </button>

    <p class="switch-link">
      <a routerLink="/forgot-password">{{ 'auth_forgot_link' | translate }}</a>
    </p>
    <p class="switch-link" style="margin-top:0.5rem">
      {{ 'auth_no_account' | translate }} <a routerLink="/signup">{{ 'auth_signup_link' | translate }}</a>
    </p>

  </div>
</div>
