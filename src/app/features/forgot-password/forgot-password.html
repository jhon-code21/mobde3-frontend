<div class="auth-container">
  <div class="auth-card">

    <div class="auth-logo">
      <svg class="auth-logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="mobde3LogoGradForgot" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b5cf6"/>
            <stop offset="50%" stop-color="#ec4899"/>
            <stop offset="100%" stop-color="#06b6d4"/>
          </linearGradient>
        </defs>
        <path d="M20 2L35 10.5V29.5L20 38L5 29.5V10.5L20 2Z" fill="url(#mobde3LogoGradForgot)"/>
        <path d="M20 5.5L32 12V28L20 34.5L8 28V12L20 5.5Z" fill="#070814" opacity="0.45"/>
        <path d="M11 27V13L20 21L29 13V27" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="20" cy="21" r="1.8" fill="#06b6d4"/>
      </svg>
      <p class="auth-brand-name">Mobde3</p>
    </div>

    <h2>Mot de passe oublié 🔑</h2>
    <p class="auth-subtitle">Entrez votre email pour recevoir un lien de réinitialisation</p>

    <input type="email" placeholder="Adresse email" #emailInput (input)="email = emailInput.value" autocomplete="email" />

    <p class="error"   *ngIf="error">{{ error }}</p>
    <p class="success" *ngIf="message">{{ message }}</p>

    <button (click)="onSubmit()" [disabled]="loading">
      {{ loading ? 'Envoi...' : 'Envoyer le lien' }}
    </button>

    <p class="switch-link" style="margin-top:1.25rem">
      <a routerLink="/login">← Retour à la connexion</a>
    </p>

  </div>
</div>
