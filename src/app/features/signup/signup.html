<div class="auth-container">
  <div class="auth-card">
    <h2>Créer un compte</h2>

    <input type="text" placeholder="Prénom" #firstNameInput (input)="firstName = firstNameInput.value" autocomplete="off" />
    <input type="text" placeholder="Nom" #lastNameInput (input)="lastName = lastNameInput.value" autocomplete="off" />
    <input type="email" placeholder="Email" #emailInput (input)="email = emailInput.value" autocomplete="off" />
    <input type="password" placeholder="Mot de passe" #passwordInput (input)="password = passwordInput.value" autocomplete="off" />

    <p class="error" *ngIf="error">{{ error }}</p>

    <button (click)="onSignup()" [disabled]="loading">
      {{ loading ? 'Création...' : 'Créer mon compte' }}
    </button>

    <p class="switch-link">
      Déjà un compte ? <a routerLink="/login">Se connecter</a>
    </p>
  </div>
</div>
