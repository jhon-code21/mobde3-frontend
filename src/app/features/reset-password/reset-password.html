<div class="auth-container">
  <div class="auth-card">
    <h2>Réinitialiser le mot de passe</h2>

    <input type="password" placeholder="Nouveau mot de passe" #pwdInput (input)="newPassword = pwdInput.value" autocomplete="off" />

    <p class="error" *ngIf="error">{{ error }}</p>
    <p class="success" *ngIf="message">{{ message }} Redirection...</p>

    <button (click)="onSubmit()" [disabled]="loading || !token">
      {{ loading ? 'Envoi...' : 'Réinitialiser' }}
    </button>

    <p class="switch-link">
      <a routerLink="/login">Retour à la connexion</a>
    </p>
  </div>
</div>
